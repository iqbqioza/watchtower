<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="WatchTower - NIP-86 relay admin panel" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
		<script>
			// Applies the stored theme before the first paint, so a light page
			// never flashes when dark mode is selected.
			try {
				const mode = localStorage.getItem('tower.theme') ?? 'system';
				const dark =
					mode === 'dark' ||
					(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			} catch {
				// Storage can be blocked; the toggle still works for this visit.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- window.nostr.js is only a fallback. It is loaded when no NIP-07 provider
		     is there, because next to an extension it flashes its own widget before
		     it steps aside. data-dof keeps it from adding `html, body { height: 100%;
		     overflow: auto }`, which would make the body the scroller and shift the
		     layout whenever a scrollbar appears. -->
		<script>
			if (!window.nostr) {
				const fallback = document.createElement('script');
				// Pinned to an exact version and verified with subresource integrity:
				// this script becomes the in-page signer for the whole panel, so a
				// compromised CDN response must not be able to execute here. When
				// bumping the version, replace the integrity hash to match.
				fallback.src =
					'https://cdn.jsdelivr.net/npm/window.nostr.js@0.8.1/dist/window.nostr.min.js';
				fallback.integrity =
					'sha384-C6TVSt1evr56iKy/quzIfLwkO/57bNpx+nFK/Hou/EA0Mr15fHwEsZN6GnMqlBEl';
				fallback.crossOrigin = 'anonymous';
				fallback.dataset.dof = '';
				// The default position (top right) covers the theme toggle of the login page.
				fallback.dataset.position = 'bottom';
				document.body.append(fallback);
			}
		</script>
	</body>
</html>
